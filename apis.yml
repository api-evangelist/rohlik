aid: rohlik
name: Rohlik
description: >-
  Rohlik (Rohlik Group) is a European online grocery service founded in 2014 by
  Tomáš Čupr and headquartered in Prague, Czechia. It operates fast, same-day and
  sub-hour grocery delivery across several markets under local brands — rohlik.cz
  in Czechia, Knuspr in Germany, Gurkerl in Austria, Kifli in Hungary, and Rohlik
  in Romania — combining an owned fulfillment/logistics stack with a wide fresh and
  private-label assortment. On the developer side, Rohlik runs an official hosted
  Model Context Protocol (MCP) server that lets AI assistants search the catalog,
  build and manage a cart, discover recipes, track and repeat orders, and manage
  shopping lists on behalf of a signed-in customer, secured with OAuth 2.0 / OpenID
  Connect via identity.rohlik.cz. Rohlik is backed by Index Ventures and Partech.
